name: Build NIVQO iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/ios/**'
      - 'mobile/ci/**'
      - '.github/workflows/build-iphone-ipa.yml'
      - 'branding/NIVQO-AppIcon.jpg.b64'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/ios/**'
      - 'mobile/ci/**'
      - '.github/workflows/build-iphone-ipa.yml'
      - 'branding/NIVQO-AppIcon.jpg.b64'

permissions:
  contents: read

concurrency:
  group: iphone-device-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: '0.9.1'
  APP_BUILD: '14'

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Report Apple toolchain
        run: |
          xcodebuild -version
          swift --version
      # mobile/ios is the authoritative source. The ZIP and patches are retained
      # only as historical inputs; applying them here would undo current fixes.
      - name: Install approved NIVQO branding
        run: |
          set -euo pipefail
          iconset=mobile/ios/NIVQO/Assets.xcassets/AppIcon.appiconset
          mkdir -p "$iconset"
          base64 -D -i branding/NIVQO-AppIcon.jpg.b64 -o "$iconset/NIVQO-source.jpg"
          sips -s format png -z 1024 1024 "$iconset/NIVQO-source.jpg" --out "$iconset/AppIcon-1024.png" >/dev/null
          rm "$iconset/NIVQO-source.jpg"
          cat > "$iconset/Contents.json" <<'JSON'
          {
            "images": [
              {
                "filename": "AppIcon-1024.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": { "author": "xcode", "version": 1 }
          }
          JSON
          test -s "$iconset/AppIcon-1024.png"
          homepage_logo=mobile/ios/NIVQO/Assets.xcassets/Brand.imageset/brand.png
          test -f "$homepage_logo"
          sips -s format png -z 512 512 "$iconset/AppIcon-1024.png" --out "$homepage_logo" >/dev/null
          test -s "$homepage_logo"
      - name: Test browser data, recovery policy and transfer protocol
        working-directory: mobile/ios
        run: swift test
      - name: Compile for iPhone Simulator
        run: |
          set -euo pipefail
          xcodebuild -project mobile/ios/NIVQO.xcodeproj -scheme NIVQO \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-simulator CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon build
      - name: Build for a physical iPhone
        run: |
          set -euo pipefail
          xcodebuild -project mobile/ios/NIVQO.xcodeproj -scheme NIVQO \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon build
      - name: Package unsigned IPA for Sideloadly
        run: |
          set -euo pipefail
          test -f build/Build/Products/Release-iphoneos/NIVQO.app/NIVQO
          mkdir -p package/Payload artifacts
          ditto build/Build/Products/Release-iphoneos/NIVQO.app package/Payload/NIVQO.app
          (cd package && zip -qry "../artifacts/NIVQO-iPhone-v${APP_VERSION}-unsigned.ipa" Payload)
      - name: Verify packaged IPA
        run: |
          set -euo pipefail
          python3 mobile/ci/verify_ipa.py "artifacts/NIVQO-iPhone-v${APP_VERSION}-unsigned.ipa" \
            --bundle-id dev.nivqo.iphone --version "$APP_VERSION" --build "$APP_BUILD" \
            --report artifacts/BUILD-VERIFICATION.txt
          (cd artifacts && shasum -a 256 *.ipa > SHA256SUMS.txt)
          cat > artifacts/READ-ME.txt <<EOF
          NIVQO iPhone ${APP_VERSION} (build ${APP_BUILD})
          Repository: ${GITHUB_REPOSITORY}
          Commit: ${GITHUB_SHA}
          Build: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Extract the downloaded GitHub artifact ZIP, then open
          NIVQO-iPhone-v${APP_VERSION}-unsigned.ipa in Sideloadly.
          Sideloadly signs the unsigned device build with your Apple account.
          Keep the same signing account and installed bundle identifier used for
          your existing NIVQO app. Do not uninstall it before updating if you want
          to preserve local browsing data. The source bundle ID is dev.nivqo.iphone.

          This workflow runs Swift unit tests, compiles for iPhone Simulator,
          builds for a physical iPhone and checks the packaged IPA's metadata,
          executable architecture, bundled icon and unsigned status. A separate
          best-effort simulator smoke check may fail when the GitHub-hosted
          simulator cannot boot reliably. Check the run summary for its result.
          The workflow does not test interactive browsing or a physical iPhone.
          See mobile/ios/README.md for device checks.
          EOF
          cat artifacts/BUILD-VERIFICATION.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: NIVQO-iPhone-for-Sideloadly
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Launch the home page in iPhone Simulator (best effort)
        id: simulator_smoke
        timeout-minutes: 7
        continue-on-error: true
        run: |
          python3 mobile/ci/simulator_smoke.py \
            build-simulator/Build/Products/Debug-iphonesimulator/NIVQO.app \
            --output artifacts/verification
      - name: Report simulator smoke result
        if: always()
        env:
          SIMULATOR_RESULT: ${{ steps.simulator_smoke.outcome }}
        run: |
          if [[ "$SIMULATOR_RESULT" == success ]]; then
            echo '### Simulator smoke: PASSED' >> "$GITHUB_STEP_SUMMARY"
            echo 'NIVQO launched in the iPhone Simulator and a screenshot was captured.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Simulator smoke: NOT VERIFIED' >> "$GITHUB_STEP_SUMMARY"
            echo 'The GitHub-hosted simulator did not complete its launch test; packaging checks are separate and this does not prove physical-device operation.' >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Simulator smoke test did not pass. Physical-device testing is still required."
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ steps.simulator_smoke.outcome == 'success' }}
        with:
          name: NIVQO-iPhone-Simulator-Launch
          path: artifacts/verification/
          if-no-files-found: error
          retention-days: 14
